<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Baby 🎂</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  color: white;
  overflow: hidden;
}

/* ALL SCREENS */
.screen {
  display: none;
  min-height: 100vh;
  width: 100%;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.screen.active {
  display: flex;
}

/* MINECRAFT BACKGROUND */
#countdown,
#cake {
  position: relative;
  background:
    linear-gradient(rgba(0,0,0,.42), rgba(0,0,0,.58)),
    url("background.jpg") center/cover no-repeat;
}

/* COUNTDOWN */
.card {
  width: min(700px, 95vw);
  padding: 35px 20px;
  background: rgba(20,20,20,.65);
  border-radius: 25px;
  backdrop-filter: blur(5px);
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

.small-title {
  letter-spacing: 4px;
  font-size: 13px;
  opacity: .9;
}

h1 {
  font-size: clamp(38px, 8vw, 70px);
  margin: 10px 0;
  font-style: italic;
  text-shadow: 3px 4px 8px #000;
}

.subtitle {
  font-size: 15px;
  opacity: .9;
}

#timer {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
  margin: 30px 0;
}

.time {
  padding: 18px 5px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 12px;
  background: rgba(255,255,255,.12);
  box-shadow: 0 5px 20px rgba(0,0,0,.25);
}

.time strong {
  display: block;
  font-size: clamp(28px, 7vw, 48px);
}

.time span {
  font-size: 10px;
  letter-spacing: 2px;
}

button {
  font-family: inherit;
  border: none;
  cursor: pointer;
}

.btn {
  padding: 14px 30px;
  border-radius: 30px;
  background: rgba(50,130,45,.9);
  color: white;
  font-weight: bold;
  font-size: 16px;
  box-shadow: 0 5px 15px #0008;
}

.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.sound {
  margin-bottom: 12px;
  background: rgba(255,255,255,.15);
}

/* CAKE */
#cake {
  flex-direction: column;
}

.cake
