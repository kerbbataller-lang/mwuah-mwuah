<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Monthsary, Baby ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  color: white;
  overflow: hidden;
}

/* ALL SCREENS */
.screen {
  display: none;
  min-height: 100vh;
  width: 100%;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.screen.active {
  display: flex;
}

/* MINECRAFT BACKGROUND */
#countdown,
#cake {
  position: relative;
  background:
    linear-gradient(rgba(0,0,0,.42), rgba(0,0,0,.58)),
    url("background.jpg") center/cover no-repeat;
}

/* COUNTDOWN */
.card {
  width: min(700px, 95vw);
  padding: 35px 20px;
  background: rgba(20,20,20,.65);
  border-radius: 25px;
  backdrop-filter: blur(5px);
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

.small-title {
  letter-spacing: 4px;
  font-size: 13px;
  opacity: .9;
}

h1 {
  font-size: clamp(38px, 8vw, 70px);
  margin: 10px 0;
  font-style: italic;
  text-shadow: 3px 4px 8px #000;
}

.subtitle {
  font-size: 15px;
  opacity: .9;
}

#timer {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
  margin: 30px 0;
}

.time {
  padding: 18px 5px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 12px;
  background: rgba(255,255,255,.12);
  box-shadow: 0 5px 20px rgba(0,0,0,.25);
}

.time strong {
  display: block;
  font-size: clamp(28px, 7vw, 48px);
}

.time span {
  font-size: 10px;
  letter-spacing: 2px;
}

button {
  font-family: inherit;
  border: none;
  cursor: pointer;
}

.btn {
  padding: 14px 30px;
  border-radius: 30px;
  background: rgba(50,130,45,.9);
  color: white;
  font-weight: bold;
  font-size: 16px;
  box-shadow: 0 5px 15px #0008;
}

.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.sound {
  margin-bottom: 12px;
  background: rgba(255,255,255,.15);
}

/* CAKE & GALLERY */
#cake {
  flex-direction: column;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-width: 320px;
  margin: 15px auto;
}

.gallery img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 12px;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 240px;
  margin: 15px auto;
}

.keypad button {
  padding: 15px;
  font-size: 20px;
  border-radius: 10px;
  background: rgba(255,255,255,.2);
  color: white;
}
</style>
</head>
<body>

<div class="screen active" id="countdown">
  <div class="card">
    <div class="small-title">FOR MY WIFEY ♡</div>
    <h1>I Love You So Much</h1>
    <p class="subtitle">Enter passcode to unlock:</p>
    <h2 id="codeDisplay">____</h2>
    
    <div class="keypad">
      <button onclick="add(1)">1</button>
      <button onclick="add(2)">2</button>
      <button onclick="add(3)">3</button>
      <button onclick="add(4)">4</button>
      <button onclick="add(5)">5</button>
      <button onclick="add(6)">6</button>
      <button onclick="add(7)">7</button>
      <button onclick="add(8)">8</button>
      <button onclick="add(9)">9</button>
      <button onclick="back()">C</button>
      <button onclick="add(0)">0</button>
      <button onclick="checkCode()">OK</button>
    </div>
  </div>
</div>

<div class="screen" id="cake">
  <div class="card">
    <h1>Our Memories ♡</h1>
    <div class="gallery">
      <img src="IMG_20260831_220323.jpg" alt="Memory 1">
      <img src="IMG_20260831_220240_578.jpg" alt="Memory 2">
      <img src="IMG_20260831_220133.jpg" alt="Memory 3">
      <img src="IMG_20260831_220059.jpg" alt="Memory 4">
    </div>
  </div>
</div>

<script>
let code = '';
const secret = '9126';

function render() {
  document.getElementById('codeDisplay').innerText = code.padEnd(4, '_');
}

function add(n) {
  if (code.length < 4) {
    code += n;
    render();
  }
}

function back() {
  code = code.slice(0, -1);
  render();
}

function checkCode() {
  if (code === secret) {
    document.getElementById('countdown').classList.remove('active');
    document.getElementById('cake').classList.add('active');
  } else {
    alert('Wrong Passcode!');
    code = '';
    render();
  }
}
</script>

</body>
</html>
